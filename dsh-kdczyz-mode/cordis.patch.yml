# Register kdczyz-dsh-model — ONE package, THREE Loader entries.
#
# Why several entries, and why they use DIFFERENT module specifiers:
#
#   entry A  name: kdczyz-dsh-model        -> lib/index.js  (WorkBuddy pool half)
#   entry B  name: kdczyz-dsh-model/trae   -> lib/trae.js   (Trae half)
#   entry C  name: kdczyz-dsh-model/qoder  -> lib/qoder.js  (Qoder half)
#
# The two halves each declare `enabledModelIds` / `imageModelIds` /
# `contextBudgets` / `authFile` with DIFFERENT semantics. Cordis keys a plugin's
# runtime — and therefore its `Config` schema — by the resolved `apply`
# FUNCTION IDENTITY (RegistryService._internal). Two entries that import the
# SAME module share ONE runtime and ONE Config, so those four names would
# collapse into a single field and the two halves would fight over one value.
# Two different modules give two independent runtimes, hence two independent
# Config schemas. That is the whole point of the split.
#
# A subpath name is safe for the client module system: `exactPackageSpecifier`
# returns undefined for anything containing "/", so entry B contributes NO
# client source. Only entry A resolves to the package root, so the package
# still has exactly ONE `./client` bundle — no "resolves from multiple active
# Loader sources" error, and the four-tab page is loaded once.
#
# The entry ids are deliberate and MUST NOT be renamed:
#   - llm-workbuddy-xdpool: the vendored pool card looks its settings scope up
#     by that exact id (vendor/xdpool/lib/client.js, WORKBUDDY_POOL_ENTRY_ID).
#   - dsh-connect-trae: matches the /trae/i probe lib/trae.js and its client
#     use, and keeps the already-saved Trae settings in this profile.
#   - dsh-connect-qoder: Qoder half. It must be its OWN module for the same
#     reason as entry B (independent Config schema / runtime), not merged into
#     lib/index.js or lib/trae.js.
# Renaming any of them makes that half's settings card read-only.
#
# NOTE: YAML comments are '#' only. JavaScript block-comment syntax is NOT a
# comment in YAML and breaks parsing.
- insert:
    - id: llm-workbuddy-xdpool
      name: kdczyz-dsh-model
    - id: dsh-connect-trae
      name: kdczyz-dsh-model/trae
    - id: dsh-connect-qoder
      name: kdczyz-dsh-model/qoder
